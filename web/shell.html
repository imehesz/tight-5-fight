<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<!-- No viewport-fit=cover: it lets the layout viewport (and so the
		     canvas) extend underneath Android's gesture pill / nav bar, which
		     is exactly where the bottom row of buttons lives. Stock Godot
		     meta keeps the page inside the safe area. -->
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
		<title>$GODOT_PROJECT_NAME</title>
		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: white;
	background-color: black;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background-color: $GODOT_SPLASH_COLOR;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
}

#status-splash.show-image--false {
	display: none;
}

#status-splash.fullsize--true {
	height: 100%;
	width: 100%;
	object-fit: contain;
}

#status-splash.use-filter--false {
	image-rendering: pixelated;
}

#status-progress, #status-notice {
	display: none;
}

#status-progress {
	bottom: 10%;
	width: 50%;
	margin: 0 auto;
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}

/* --- Landscape gate -------------------------------------------------------
   The engine's window/handheld/orientation setting only applies to native
   Android/iOS builds; on the Web the browser decides. So we cover the canvas
   with a "rotate your phone" panel whenever a touch device is in portrait.
   Pure CSS media query, so it reacts instantly with no resize listener. */

@font-face {
	font-family: 'Press Start 2P';
	src: url('PressStart2P-Regular.ttf?v={{version}}') format('truetype');
	font-display: swap;
}

#rotate-gate {
	display: none;
	position: fixed;
	inset: 0;
	z-index: 100;
	background-color: #000;
	color: #fff;
	font-family: 'Press Start 2P', 'Courier New', monospace;
	text-align: center;
	flex-direction: column;
	align-items: center;
	justify-content: center;
	gap: 1.6rem;
	padding: 2rem 1.4rem;
	box-sizing: border-box;
	touch-action: none;
	-webkit-user-select: none;
	user-select: none;
}

#rotate-gate .rotate-phone {
	width: 84px;
	height: 84px;
	animation: rotate-hint 2.4s ease-in-out infinite;
}

#rotate-gate .rotate-title {
	font-size: 1rem;
	line-height: 1.7;
	color: #ffd23f;
}

#rotate-gate .rotate-sub {
	font-size: 0.62rem;
	line-height: 1.9;
	color: #fff;
}

#rotate-gate .rotate-hint {
	font-size: 0.5rem;
	line-height: 1.9;
	color: #8a8a8a;
	max-width: 26em;
}

@keyframes rotate-hint {
	0%, 30% { transform: rotate(0deg); }
	55%, 85% { transform: rotate(-90deg); }
	100% { transform: rotate(0deg); }
}

@media (prefers-reduced-motion: reduce) {
	#rotate-gate .rotate-phone { animation: none; transform: rotate(-90deg); }
}

/* Touch devices only — a narrow desktop window should not lock anyone out. */
@media (orientation: portrait) and (pointer: coarse) {
	#rotate-gate { display: flex; }
}
		</style>
		$GODOT_HEAD_INCLUDE
	</head>
	<body>
		<canvas id="canvas">
			Your browser does not support the canvas tag.
		</canvas>

		<noscript>
			Your browser does not support JavaScript.
		</noscript>

		<div id="status">
			<img id="status-splash" class="$GODOT_SPLASH_CLASSES" src="$GODOT_SPLASH?v={{version}}" alt="">
			<progress id="status-progress"></progress>
			<div id="status-notice"></div>
		</div>

		<div id="rotate-gate" role="alertdialog" aria-label="Please rotate your device to landscape">
			<svg class="rotate-phone" viewBox="0 0 48 48" fill="none" aria-hidden="true">
				<rect x="14" y="4" width="20" height="40" rx="3" stroke="#ffd23f" stroke-width="3"/>
				<line x1="20" y1="9" x2="28" y2="9" stroke="#ffd23f" stroke-width="2" stroke-linecap="round"/>
				<circle cx="24" cy="38" r="2" fill="#ffd23f"/>
			</svg>
			<div class="rotate-title">ROTATE<br>YOUR PHONE</div>
			<div class="rotate-sub">THIS FIGHT IS<br>LANDSCAPE ONLY</div>
			<div class="rotate-hint">Nothing happening? Turn off rotation lock in your Control Center / quick settings.</div>
		</div>

		<script src="$GODOT_URL?v={{version}}"></script>
		<script>
// --- Cache busting --------------------------------------------------------
// deployScriptPROD.sh rewrites every {{version}} in the built index.html with
// the build stamp (the same one Settings shows as v.1.0.<stamp>) right before
// rsync, so a new deploy always lands on fresh URLs.
//
// The <script> tag above and the font/splash URLs carry ?v= directly, but the
// two big files — index.wasm and index.pck — are fetched by the engine itself
// from paths it builds internally ("index" + extension), with no config hook
// to version them. So we wrap fetch() and tag those requests on the way out.
// The engine calls the global fetch() at load time, so this must run before
// startGame() below — it does.
(function () {
	const raw = '{{version}}';
	// Unreplaced placeholder => running a local/unbaked build, skip busting.
	if (raw.indexOf('{{') === 0) {
		return;
	}
	const bustable = /(^|\/)index\.(wasm|pck)$/;
	const nativeFetch = window.fetch.bind(window);
	window.fetch = function (input, init) {
		if (typeof input === 'string' && bustable.test(input.split('?')[0])) {
			return nativeFetch(input + (input.indexOf('?') === -1 ? '?' : '&') + 'v=' + raw, init);
		}
		return nativeFetch(input, init);
	};
}());

// --- iOS WebAudio unlock ---------------------------------------------------
// Godot builds its AudioContext during startGame(), i.e. before the player has
// touched anything, so it is born suspended. The engine does ask the browser to
// resume it from its own input handlers, which is enough for Android Chrome and
// desktop — but iOS Safari also wants a buffer to have actually flowed through
// the graph inside a real user gesture before it will route audio anywhere. Not
// getting that is why the iPhone build was silent while everything else worked.
//
// Safari also suspends the context whenever the app is backgrounded or the
// phone is locked and does NOT always fire the engine's resume path on return,
// so these listeners stay installed for the whole session rather than removing
// themselves after the first tap. They cost nothing while the context is
// already running.
//
// This must run before engine.startGame() below so the wrapper is in place when
// the engine constructs its context — it does.
(function () {
	const Native = window.AudioContext || window.webkitAudioContext;
	if (!Native) {
		return;
	}
	const contexts = [];
	function TrackedAudioContext() {
		const ctx = Reflect.construct(Native, arguments, Native);
		contexts.push(ctx);
		hardenAddModule(ctx);
		return ctx;
	}
	TrackedAudioContext.prototype = Native.prototype;
	window.AudioContext = TrackedAudioContext;
	if (window.webkitAudioContext) {
		window.webkitAudioContext = TrackedAudioContext;
	}

	// --- Audio-object accounting (iphone-fixes branch) ---------------------
	// The crash hunt's confirmed suspect is WebAudio object accumulation:
	// Godot 4.4's Sample playback spawns a position-reporting worklet node per
	// sound played, and WebKit never frees them (godotengine/godot#107390,
	// PR #107948) — memory grows where no engine counter can see it. These
	// counters are the proof either way: the flight recorder mirrors them into
	// every heartbeat, so a crash report shows exactly how much audio
	// machinery had ever been created at the moment of death. Monotonic on
	// purpose — a WebKit-side leak tracks what was CREATED, not what JS still
	// references. With default_playback_type.web=0 (Stream, the fix under
	// test) `wk` should sit at ~1 and `src` should stop climbing; if crashes
	// continue anyway with those flat, audio is exonerated and the next
	// suspect is GPU-side (see the gl event).
	const audioStats = {
		workletNodes: 0,   // AudioWorkletNode constructions (the leaking kind)
		bufferSources: 0,  // one per sample play, + one per unlock gesture
		decodes: 0,        // decodeAudioData calls
		decodedMB: 0,      // decoded PCM WebKit must hold, in MB
	};
	window.__t5audio = {
		stats: audioStats,
		summary: function () {
			let states = '';
			contexts.forEach(function (c) {
				try { states += String(c.state).charAt(0); } catch (err) { states += '?'; }
			});
			return 'wk ' + audioStats.workletNodes + ' src ' + audioStats.bufferSources +
				' dec ' + audioStats.decodes + ' ' + Math.round(audioStats.decodedMB) + 'M' +
				' ctx ' + (states || '-');
		},
	};
	if (window.AudioWorkletNode) {
		const NativeWorkletNode = window.AudioWorkletNode;
		const CountedWorkletNode = function () {
			audioStats.workletNodes += 1;
			return Reflect.construct(NativeWorkletNode, arguments, NativeWorkletNode);
		};
		CountedWorkletNode.prototype = NativeWorkletNode.prototype;
		window.AudioWorkletNode = CountedWorkletNode;
	}
	(function () {
		// createBufferSource/decodeAudioData live on BaseAudioContext, but
		// shadowing them on the AudioContext prototype covers every context
		// the engine (or our unlock primer) will ever make.
		const proto = Native.prototype;
		const nativeCreateBufferSource = proto.createBufferSource;
		if (typeof nativeCreateBufferSource === 'function') {
			proto.createBufferSource = function () {
				audioStats.bufferSources += 1;
				return nativeCreateBufferSource.apply(this, arguments);
			};
		}
		const nativeDecode = proto.decodeAudioData;
		if (typeof nativeDecode === 'function') {
			proto.decodeAudioData = function () {
				audioStats.decodes += 1;
				const promise = nativeDecode.apply(this, arguments);
				if (promise && typeof promise.then === 'function') {
					promise.then(function (buffer) {
						if (buffer && buffer.length) {
							audioStats.decodedMB +=
								(buffer.length * buffer.numberOfChannels * 4) / 1048576;
						}
					}, function () { /* decode failed; nothing to count */ });
				}
				return promise;
			};
		}
	}());

	// As of the iphone-fixes branch this project exports with
	// audio/general/default_playback_type.web = 0 (Stream) — see project.godot
	// for why (the Sample machinery leaks in WebKit and is the prime crash
	// suspect). The hardening below is mode-agnostic and stays: in Sample mode
	// every sound awaits index.audio.position.worklet.js before its start();
	// in Stream mode the output worklet load matters the same way. Either way
	// an addModule() that rejects or never settles means silence with no
	// visible error, and Godot requests it immediately after constructing the
	// context — while it is still suspended, which is exactly the situation
	// Safari is unreliable in.
	//
	// So: retry instead of accepting the first answer, and race each attempt
	// against a timeout so a promise that simply never settles is covered too.
	// The returned promise resolves on the first success and only rejects once
	// we are out of attempts — a stall here degrades to the silence we already
	// have, never to something worse.
	const ATTEMPT_TIMEOUT_MS = 2500;
	const MAX_ATTEMPTS = 6;

	function hardenAddModule(ctx) {
		const worklet = ctx.audioWorklet;
		if (!worklet || typeof worklet.addModule !== 'function') {
			return;
		}
		const nativeAddModule = worklet.addModule.bind(worklet);
		worklet.addModule = function (url, options) {
			return new Promise(function (resolve, reject) {
				let attempts = 0;
				function attempt() {
					attempts += 1;
					let settled = false;
					nativeAddModule(url, options).then(function () {
						settled = true;
						resolve();
					}, function (err) {
						settled = true;
						retry(err);
					});
					setTimeout(function () {
						if (!settled) {
							retry(new Error('addModule timed out: ' + url));
						}
					}, ATTEMPT_TIMEOUT_MS);
				}
				function retry(err) {
					if (attempts >= MAX_ATTEMPTS) {
						reject(err);
						return;
					}
					// A tap between now and then is what usually makes the
					// difference, so leave room for one.
					setTimeout(attempt, 600);
				}
				attempt();
			});
		};
	}

	// iOS puts a page's WebAudio on the "ambient" audio session, which the
	// phone's physical mute switch silences outright — there is no equivalent
	// on Android, which is why that build was fine. Declaring the session as
	// "playback" moves us onto the media channel, so the game is audible with
	// the ringer switch off, same as a video. Safari 16.4+; a no-op elsewhere.
	function claimPlaybackSession() {
		try {
			if (navigator.audioSession && navigator.audioSession.type !== 'playback') {
				navigator.audioSession.type = 'playback';
			}
		} catch (err) {
			/* older Safari: nothing we can do from here */
		}
	}
	claimPlaybackSession();

	let primed = false;
	function unlock() {
		claimPlaybackSession();
		contexts.forEach(function (ctx) {
			if (ctx.state === 'running' && primed) {
				return;
			}
			try {
				const promise = ctx.resume();
				if (promise && typeof promise.catch === 'function') {
					promise.catch(function () { /* nothing else to try */ });
				}
			} catch (err) {
				/* closed context */
			}
			// One silent frame. This is the part iOS actually requires, and it
			// has to happen inside the gesture — which is where we are.
			try {
				const source = ctx.createBufferSource();
				source.buffer = ctx.createBuffer(1, 1, ctx.sampleRate);
				source.connect(ctx.destination);
				source.start(0);
				primed = true;
			} catch (err) {
				/* context not usable yet; the next gesture retries */
			}
		});
	}

	['touchstart', 'touchend', 'pointerdown', 'mousedown', 'keydown'].forEach(function (type) {
		window.addEventListener(type, unlock, { passive: true, capture: true });
	});
	document.addEventListener('visibilitychange', function () {
		if (!document.hidden) {
			unlock();
		}
	});
	window.addEventListener('pageshow', unlock);
}());

// --- Crash flight recorder ------------------------------------------------
// Chasing the iPhone-only "the game randomly restarts itself" report. Nothing
// in the game can restart it — there is exactly one change_scene call in the
// project and it is the venue door — so the page itself must be going down
// and coming back. On iOS that is almost always Safari's WebContent process
// being killed (memory pressure) and silently re-navigated: no error fires,
// because the process that would report it is already gone.
//
// So the evidence has to survive the crash ON the device. Every couple of
// seconds CrashDiag (autoload/crash_diag.gd) hands us a snapshot, which we
// mirror into localStorage. On the next boot we look at what the previous
// life left behind:
//
//   - pagehide fired (clean=1)  -> the player navigated away or closed the
//                                  tab. Normal. No report.
//   - no pagehide, boots > 1    -> the page went down where it stood and came
//                                  back on its own. THAT is the crash, and the
//                                  final snapshot is what it was doing.
//
// The record is handed to CrashDiag, which POSTs it once and deletes it, so
// this costs the server one small row per crash — not a telemetry stream.
(function () {
	const LIVE = 't5diag.live';
	const PENDING = 't5diag.pending';
	const BOOTS = 't5diag.boots';
	const MAX_EVENTS = 6;
	const HEARTBEAT_KEYS_MAX = 40;

	// Safari in private mode gives storage a zero quota and THROWS on write,
	// so every access here is best-effort. Losing the recorder must never
	// cost anyone their game.
	function readJson(store, key) {
		try {
			const raw = store.getItem(key);
			return raw ? JSON.parse(raw) : null;
		} catch (err) {
			return null;
		}
	}

	function writeJson(store, key, value) {
		try {
			store.setItem(key, JSON.stringify(value));
		} catch (err) {
			/* private mode / quota: run without the recorder */
		}
	}

	function drop(store, key) {
		try {
			store.removeItem(key);
		} catch (err) {
			/* as above */
		}
	}

	// The WASM heap is the number that decides this question. iOS kills a tab
	// on its process footprint, and for a Godot build the heap IS most of that
	// footprint — but nothing exposes it to the page. So intercept the module
	// as it is instantiated and keep its exported memory: heap bytes are then
	// just buffer.byteLength, live, for free, forever.
	//
	// This has to be installed before engine.startGame() below, and it is.
	let wasmMemory = null;
	function captureMemory(result) {
		try {
			// instantiate() resolves to {module, instance} for a buffer and to
			// a bare Instance for an already-compiled Module. Handle both.
			const instance = result && result.instance ? result.instance : result;
			const memory = instance && instance.exports && instance.exports.memory;
			if (memory && memory.buffer) {
				wasmMemory = memory;
			}
		} catch (err) {
			/* not the shape we expected; heap simply reports 0 */
		}
		return result;
	}
	['instantiate', 'instantiateStreaming'].forEach(function (name) {
		const native = WebAssembly[name];
		if (typeof native !== 'function') {
			return;
		}
		WebAssembly[name] = function () {
			return native.apply(WebAssembly, arguments).then(captureMemory);
		};
	});

	// sessionStorage is scoped to the tab and Safari deliberately preserves it
	// across a WebContent crash so it can restore the tab — which is exactly
	// what makes it able to tell "reloaded in place" from "opened fresh".
	let boots = 1;
	try {
		boots = (parseInt(sessionStorage.getItem(BOOTS), 10) || 0) + 1;
		sessionStorage.setItem(BOOTS, String(boots));
	} catch (err) {
		/* no sessionStorage: boots stays 1 and we simply never report */
	}

	function navigationType() {
		try {
			const nav = performance.getEntriesByType('navigation')[0];
			return nav && nav.type ? String(nav.type) : '';
		} catch (err) {
			return '';
		}
	}

	// Hand the previous life's last words to CrashDiag, if it died mid-play.
	const previous = readJson(localStorage, LIVE);
	drop(localStorage, LIVE);
	if (previous && boots > 1 && !previous.clean) {
		previous.navType = navigationType();
		previous.boots = boots;
		writeJson(localStorage, PENDING, previous);
	}

	const started = Date.now();
	const live = {
		v: 1,
		reason: '',
		events: [],
		hidden: 0,
		// Static device shape. All iPhones report "iPhone" in the UA, so the
		// screen and core count are what actually separate an SE from a Pro —
		// and RAM is what decides when iOS pulls the trigger.
		dpr: window.devicePixelRatio || 1,
		sw: (window.screen && window.screen.width) || 0,
		sh: (window.screen && window.screen.height) || 0,
		cores: navigator.hardwareConcurrency || 0,
	};

	function uptime() {
		return Math.round((Date.now() - started) / 1000);
	}

	function persist() {
		live.uptime = uptime();
		live.heap = wasmMemory ? wasmMemory.buffer.byteLength : 0;
		writeJson(localStorage, LIVE, live);
	}

	// A short ring of anything notable that happened before the end. Capped so
	// a page that spews errors can't grow the record without bound.
	function note(reason, detail) {
		if (live.events.length < MAX_EVENTS) {
			live.events.push({
				t: uptime(),
				r: reason,
				d: String(detail === undefined || detail === null ? '' : detail).slice(0, 120),
			});
		}
		live.reason = reason;
		persist();
	}

	window.addEventListener('error', function (e) {
		note('error', e && e.message);
	});
	window.addEventListener('unhandledrejection', function (e) {
		note('rejection', e && e.reason);
	});

	const canvas = document.getElementById('canvas');
	if (canvas) {
		// If Safari drops the GL context instead of killing the process, the
		// engine has no recovery path — this is the other candidate, and it
		// leaves a fingerprint the memory theory doesn't.
		canvas.addEventListener('webglcontextlost', function () {
			note('webglcontextlost', '');
		});
		canvas.addEventListener('webglcontextcreationerror', function (e) {
			note('webglcontextcreationerror', e && e.statusMessage);
		});
	}

	// The audio accounting from the unlock wrapper above, refreshed into ONE
	// self-updating slot of the event ring — never appended twice, so real
	// errors keep their room, and like mark() it never touches live.reason.
	// Riding inside `events` means the server, the crashes table and the admin
	// page all need no change: the numbers appear in the "why" hover of the
	// crash report. Reading one: `wk` = AudioWorkletNode constructions (the
	// WebKit-leaking kind — should sit at ~1 in Stream mode, climbs per sound
	// in Sample mode), `src` = buffer sources ever made, `dec` = decodes and
	// decoded MB WebKit holds, `ctx` = each context's state initial (r/s/c).
	let audioSlot = -1;
	function noteAudio() {
		if (!window.__t5audio) {
			return;
		}
		const entry = {
			t: uptime(),
			r: 'audio',
			d: String(window.__t5audio.summary()).slice(0, 120),
		};
		if (audioSlot === -1) {
			if (live.events.length >= MAX_EVENTS) {
				return;
			}
			audioSlot = live.events.length;
			live.events.push(entry);
		} else {
			live.events[audioSlot] = entry;
		}
	}

	// Like note(), but for facts rather than failures. It must NOT set
	// live.reason: the crash panel's "why" column reading "silent" is the
	// single most important signal we have, and a device fact must never
	// masquerade as a cause of death.
	function mark(reason, detail) {
		if (live.events.length < MAX_EVENTS) {
			live.events.push({
				t: uptime(),
				r: reason,
				d: String(detail === undefined || detail === null ? '' : detail).slice(0, 120),
			});
		}
		persist();
	}

	// One-shot device facts, captured on the first heartbeat — by then the
	// engine has sized its canvas and created the GL context. These ride into
	// the crash record as an EVENT rather than as new fields, so the backend,
	// the crashes table and the admin page all need no change whatsoever;
	// they show up under the "why" hover.
	//
	// The drawing-buffer size is the number that matters: it is the real
	// framebuffer the GPU process has to hold, it scales with the square of
	// the pixel ratio, and NOTHING in the engine-side snapshot can see it
	// (texMem counts textures, not render targets).
	let factsDone = false;
	function captureFacts() {
		if (factsDone) {
			return;
		}
		factsDone = true;
		const bits = [];
		const ratio = window.__t5dpr || { real: window.devicePixelRatio || 1 };
		bits.push('dpr ' + ratio.real + '->' + (ratio.effective || ratio.real));
		try {
			// getContext returns the EXISTING context when the canvas already
			// has one, so this reads Godot's context rather than allocating a
			// second — which on a GPU-pressure hunt would be self-defeating.
			const gl = canvas && (canvas.getContext('webgl2') || canvas.getContext('webgl'));
			if (!gl) {
				bits.push('no gl');
			} else {
				bits.push('buf ' + gl.drawingBufferWidth + 'x' + gl.drawingBufferHeight);
				bits.push('maxtex ' + gl.getParameter(gl.MAX_TEXTURE_SIZE));
				let name = '';
				const dbg = gl.getExtension('WEBGL_debug_renderer_info');
				if (dbg) {
					name = gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL);
				}
				if (!name) {
					name = gl.getParameter(gl.RENDERER);
				}
				if (name) {
					bits.push(String(name));
				}
			}
		} catch (err) {
			bits.push('gl read failed');
		}
		mark('gl', bits.join(' | '));
	}

	// The asymmetry the whole diagnosis rests on: a graceful leave fires
	// pagehide, a process kill fires nothing at all.
	window.addEventListener('pagehide', function () {
		live.clean = 1;
		persist();
	});
	window.addEventListener('pageshow', function () {
		// Restored from the back/forward cache: this life is running again, so
		// it is no longer "cleanly ended".
		live.clean = 0;
		persist();
	});
	document.addEventListener('visibilitychange', function () {
		if (document.hidden) {
			live.hidden += 1;
			persist();
		}
	});

	window.__t5diag = {
		// Called by CrashDiag with a JSON object of engine-side fields.
		beat: function (json) {
			let fields;
			try {
				fields = JSON.parse(json);
			} catch (err) {
				return;
			}
			if (!fields || typeof fields !== 'object') {
				return;
			}
			let n = 0;
			for (const key in fields) {
				if (n++ >= HEARTBEAT_KEYS_MAX) {
					break;
				}
				live[key] = fields[key];
			}
			// A first beat means the engine is up and the canvas is sized.
			captureFacts();
			noteAudio();
			persist();
		},
		// The previous life's final snapshot as JSON, or '' if it ended well.
		pending: function () {
			const row = readJson(localStorage, PENDING);
			return row ? JSON.stringify(row) : '';
		},
		clearPending: function () {
			drop(localStorage, PENDING);
		},
	};

	persist();
}());

// ------------------------------------------------------- pixel-ratio cap
// Godot sizes its canvas by window.devicePixelRatio. On a 3x phone that means
// an 852x393 CSS canvas is rendered at 2556x1179 — about 3.0 million pixels,
// MORE than a 1080p desktop — inside WebKit's separate GPU process, which has
// far tighter limits than the page's own memory. None of that is visible to
// the flight recorder above: texMem counts textures, not framebuffers, so a
// GPU-side ceiling looks exactly like what we measured on 2026-07-25 — every
// engine number flat, 60fps to the last heartbeat, then the page reloads in
// place with no crash log and no jetsam event.
//
// This is a 640x360 pixel-art game, so even 1x on a phone is above the design
// resolution and the visual cost is close to nothing.
//
// MUST run before `new Engine()`, and deliberately runs AFTER the recorder so
// that live.dpr still records the device's REAL ratio — the crash panel's
// "device" column has to keep identifying the hardware honestly. The
// effective value is reported separately in the "gl" event.
//
//   ?dpr=native  device value, i.e. the old behaviour   (A/B against this build)
//   ?dpr=2       middle setting
//   default      capped at DEFAULT_MAX_DPR
(function () {
	const real = window.devicePixelRatio || 1;
	// Tested on an iPhone 15 on 2026-07-25: capping to 1x changed NOTHING
	// (crashes landed at the same 2m3s as native), so the cap is not the fix
	// and players keep the sharp canvas. The switch stays for A/B use.
	let effective = real;
	try {
		const want = new URLSearchParams(window.location.search).get('dpr');
		if (want === 'native') {
			effective = real;
		} else if (want) {
			const n = parseFloat(want);
			if (!isNaN(n) && n > 0) {
				effective = n;
			}
		}
	} catch (err) {
		/* no URLSearchParams, or a URL it refuses to parse: keep the default */
	}
	// Never scale UP — asking a 1x desktop for 3x would be a pure own goal.
	effective = Math.min(real, Math.max(1, effective));
	window.__t5dpr = { real: real, effective: effective };
	if (effective === real) {
		return;
	}
	try {
		// An own property on window shadows the prototype getter, which is
		// what the engine reads through godot_js_display_pixel_ratio_get.
		Object.defineProperty(window, 'devicePixelRatio', {
			configurable: true,
			get: function () { return effective; },
		});
	} catch (err) {
		// Non-configurable on this browser: play at native rather than fail.
		window.__t5dpr.effective = real;
	}
}());

const GODOT_CONFIG = $GODOT_CONFIG;
const GODOT_THREADS_ENABLED = $GODOT_THREADS_ENABLED;
const engine = new Engine(GODOT_CONFIG);

// Best-effort hard lock. Only Android Chrome/Firefox honour this, and only
// while fullscreen, so it is a bonus on top of the CSS gate above — never the
// only defence. iOS Safari has no Screen Orientation lock at all.
(function () {
	function lockLandscape() {
		try {
			const orientation = window.screen && window.screen.orientation;
			if (orientation && typeof orientation.lock === 'function') {
				const promise = orientation.lock('landscape');
				if (promise && typeof promise.catch === 'function') {
					promise.catch(function () { /* not permitted here; CSS gate covers it */ });
				}
			}
		} catch (err) {
			/* unsupported browser */
		}
	}
	document.addEventListener('fullscreenchange', lockLandscape);
	document.addEventListener('webkitfullscreenchange', lockLandscape);
	window.addEventListener('load', lockLandscape);
}());

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
		</script>
	</body>
