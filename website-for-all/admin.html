<!doctype html>
<!--
  TIGHT 5 FIGHT! — owner stats page. Deploys with index.html (same rsync).

  Opens as https://games.imstandup.com/admin.html?pwd=SECRET — anything else
  (no pwd, wrong pwd) bounces straight back to index.html. The pwd is NOT in
  this file: it is forwarded to the API's /stats endpoint, which holds the
  real value (server/config.js adminPwd) and answers 403 on a mismatch.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TIGHT 5 FIGHT! — STATS</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  :root {
    --night:   #0b0716;
    --street:  #141022;
    --panel:   #1a1130;
    --pink:    #ff59cc;
    --purple:  #7326bf;
    --gold:    #ffd966;
    --paper:   #f5eee4;
    --dim:     #b9a8d6;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { max-width: 100%; }
  body {
    font-family: "Press Start 2P", "Courier New", monospace;
    color: var(--paper);
    background: linear-gradient(180deg, var(--night) 0%, var(--night) 45%, #170d2b 78%, var(--street) 100%);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 28px 16px 40px;
    text-align: center;
  }
  h1 {
    font-size: clamp(18px, 5.5vw, 32px);
    line-height: 1.3;
    color: var(--pink);
    text-shadow: 0 0 6px var(--pink), 0 0 18px var(--pink), 3px 3px 0 #3a0f33;
  }
  .stamp {
    margin-top: 12px;
    font-size: clamp(8px, 2.2vw, 10px);
    color: var(--dim);
  }
  #status {
    margin-top: 40px;
    font-size: clamp(10px, 2.6vw, 13px);
    color: var(--gold);
  }

  /* Ecosystem totals: the shareable headline row. Same tile grammar as the
     game panels (dim label over a big gold figure), one tile per number. */
  .totals {
    margin: 26px auto 0;
    width: 100%;
    max-width: 960px;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(168px, 1fr));
    gap: 16px;
  }
  .tile {
    background: var(--panel);
    border: 3px solid var(--pink);
    border-radius: 10px;
    box-shadow: 0 0 14px #ff59cc55, inset 0 0 30px #0007;
    padding: 20px 12px 22px;
  }
  .tile .label {
    font-size: clamp(9px, 2.3vw, 11px);
    color: var(--dim);
    text-shadow: 1px 1px 0 #000;
  }
  .tile .value {
    margin-top: 14px;
    font-size: clamp(18px, 4.5vw, 30px);
    color: var(--gold);
    text-shadow: 3px 3px 0 #000, 0 0 14px #ffd96688;
  }
  .totals-caption {
    grid-column: 1 / -1;
    font-size: clamp(8px, 2vw, 9px);
    color: var(--dim);
  }

  .games {
    margin: 26px auto 0;
    width: 100%;
    max-width: 960px;
    display: flex;
    flex-direction: column;
    gap: 24px;
  }
  .game {
    background: var(--panel);
    border: 3px solid var(--purple);
    border-radius: 10px;
    box-shadow: 0 0 14px #7326bf66, inset 0 0 30px #0007;
    padding: 18px 14px 22px;
  }
  .game h2 {
    font-size: clamp(18px, 4.5vw, 24px);
    color: var(--gold);
    text-shadow: 2px 2px 0 #000, 0 0 10px #ffd96655;
  }
  .game h2 small {
    display: block;
    margin-top: 6px;
    font-size: clamp(8px, 2vw, 9px);
    color: var(--dim);
  }
  .boards {
    margin-top: 16px;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 16px;
  }
  .board { overflow-x: auto; }
  .board h3 {
    font-size: clamp(10px, 2.6vw, 12px);
    color: var(--pink);
    text-shadow: 2px 2px 0 #000;
    margin-bottom: 10px;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: clamp(9px, 2.3vw, 11px);
  }
  th, td {
    padding: 8px 6px;
    border-bottom: 1px solid #7326bf55;
    text-shadow: 1px 1px 0 #000;
  }
  th { color: var(--dim); font-weight: normal; text-align: left; }
  td { text-align: left; color: var(--paper); }
  th.num, td.num { text-align: right; }
  /* The crash table carries far more columns than the boards. Let it size to
     its content and scroll inside .board (overflow-x: auto) rather than
     squeezing every column and wrapping the timestamp onto three lines. */
  table.crash { width: auto; min-width: 100%; }
  table.crash th, table.crash td { white-space: nowrap; }
  td.num { color: var(--gold); }
  tr:last-child th, tr:last-child td { border-bottom: none; }
  .empty { color: var(--dim); font-size: clamp(9px, 2.3vw, 10px); }

  .back {
    margin-top: 34px;
    display: inline-flex;
    align-items: center;
    min-height: 48px;
    padding: 0 22px;
    font-size: clamp(10px, 2.6vw, 12px);
    color: #fff;
    background: linear-gradient(180deg, var(--pink), #c1279a);
    border: 2px solid #ffb3e6;
    border-radius: 8px;
    box-shadow: 0 0 12px #ff59cc99, 0 4px 0 #7a1560;
    text-decoration: none;
    text-shadow: 2px 2px 0 #0008;
  }
</style>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="imgs/t5f-logo_mid.png">
</head>
<body>

<h1>TIGHT 5 FIGHT!<br>STATS</h1>
<p class="stamp" id="stamp"></p>
<p id="status">LOADING…</p>
<section class="totals" id="totals"></section>
<main class="games" id="games"></main>
<a class="back" href="index.html">◀ BACK TO THE MARQUEE</a>

<script>
(function () {
  "use strict";

  var pwd = new URLSearchParams(location.search).get("pwd");
  if (!pwd) { location.replace("index.html"); return; }

  // Same host logic as the game's leaderboard.gd: on the real domain go
  // through Apache's /tight5fight/api proxy; anywhere else talk to a local
  // dev server directly.
  function apiBase() {
    var h = location.hostname;
    if (h.endsWith("imstandup.com") || h.endsWith("mehesz.net")) {
      return location.protocol + "//games.imstandup.com/tight5fight/api";
    }
    if (h && h !== "localhost" && h !== "127.0.0.1") return "http://" + h + ":8770";
    return "http://127.0.0.1:8770";
  }

  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text !== undefined) n.textContent = text;
    return n;
  }

  // The two DB drivers hand back timestamps differently: SQLite (dev) stores
  // "YYYY-MM-DD HH:MM:SS" in UTC, while MySQL (prod) comes through JSON as a
  // real ISO string. Accept both, and fall back to showing it raw.
  function crashWhen(at) {
    if (!at) return "?";
    var raw = String(at);
    var iso = raw.indexOf("T") === -1 ? raw.replace(" ", "T") + "Z" : raw;
    var when = new Date(iso);
    return isNaN(when.getTime()) ? raw : when.toLocaleString();
  }

  // Byte counts read as megabytes here — the crash panel compares footprints,
  // and nobody eyeballs a difference in a ten-digit number.
  function mb(bytes) {
    var n = Number(bytes);
    if (!n) return "0";
    return Math.round(n / 1048576) + "M";
  }

  // Seconds as "4m 07s" — run lengths are read against a 5:00 clock, so
  // minutes are the unit the number means something in.
  function mmss(secs) {
    var s = Math.max(0, Math.round(Number(secs) || 0));
    return Math.floor(s / 60) + "m " + ("0" + (s % 60)).slice(-2) + "s";
  }

  // rows: [[label, value], ...] with a header pair first.
  function board(title, header, rows) {
    var box = el("div", "board");
    box.appendChild(el("h3", null, title));
    if (rows.length === 0) {
      box.appendChild(el("p", "empty", "no data yet"));
      return box;
    }
    var table = el("table");
    var tr = el("tr");
    tr.appendChild(el("th", null, header[0]));
    tr.appendChild(el("th", "num", header[1]));
    table.appendChild(tr);
    rows.forEach(function (r) {
      var row = el("tr");
      row.appendChild(el("td", null, r[0]));
      row.appendChild(el("td", "num", String(r[1])));
      table.appendChild(row);
    });
    box.appendChild(table);
    return box;
  }

  fetch(apiBase() + "/stats?pwd=" + encodeURIComponent(pwd))
    .then(function (resp) {
      if (resp.status === 403) { location.replace("index.html"); throw new Error("403"); }
      if (!resp.ok) throw new Error("HTTP " + resp.status);
      return resp.json();
    })
    .then(function (data) {
      document.getElementById("status").remove();
      document.getElementById("stamp").textContent =
        "GENERATED " + new Date(data.generatedAt).toLocaleString();

      // Ecosystem headline row (guarded: a backend older than this page
      // simply has no totals block, and the row stays empty).
      if (data.totals) {
        var totalsEl = document.getElementById("totals");
        [
          ["RUNS FINISHED", data.totals.runs],
          ["NPCs BEAT UP", data.totals.npcsBeaten],
          ["VENUE FIGHTS", data.totals.venueFights],
          ["ALL COMEDIANS", data.totals.comedians],
          ["ALL VENUES", data.totals.venues],
        ].forEach(function (t) {
          if (t[1] == null) return; // field absent on an older backend
          var tile = el("div", "tile");
          tile.appendChild(el("div", "label", t[0]));
          tile.appendChild(el("div", "value", Number(t[1]).toLocaleString("en-US")));
          totalsEl.appendChild(tile);
        });
        totalsEl.appendChild(el("p", "totals-caption",
          "ALL GAMES COMBINED · ALL TIME"));
      }

      var main = document.getElementById("games");
      data.games.forEach(function (g) {
        var v = g.volume;
        var section = el("section", "game");
        var h2 = el("h2", null, g.label);
        h2.appendChild(el("small", null, "game id: " + g.gameId));
        section.appendChild(h2);
        var boards = el("div", "boards");
        boards.appendChild(board("PLAYS", ["window", "runs / players"], [
          ["today",        v.today.plays   + " / " + v.today.players],
          ["last 7 days",  v.week.plays    + " / " + v.week.players],
          ["last 30 days", v.month.plays   + " / " + v.month.players],
          ["all time",     v.allTime.plays + " / " + v.allTime.players],
        ]));
        // How long runs actually last against the 5:00 clock: well under it
        // is a player who died early, at or past it is a player who went the
        // distance (venue clears and good set boxes add time back, so a run
        // can run long). Rows are skipped entirely on an older backend.
        boards.appendChild(board("RUN LENGTH", ["window", "avg · 5m+ runs"],
          [["today", v.today], ["last 7 days", v.week],
           ["last 30 days", v.month], ["all time", v.allTime]]
            .filter(function (w) { return w[1] && w[1].avgSeconds != null; })
            .map(function (w) {
              var d = w[1];
              return [w[0], mmss(d.avgSeconds) + " · " + d.fullRuns + " / " + d.timedRuns];
            })));
        boards.appendChild(board("TOP 5 MOST PLAYED", ["comedian", "plays"],
          g.topPlayed.map(function (r) { return [r.character, r.plays]; })));
        boards.appendChild(board("TOP 5 MOST BEAT UP", ["comedian", "KOs"],
          g.topBeat.map(function (r) { return [r.character, r.kos]; })));
        boards.appendChild(board("TOP 5 VENUES", ["venue", "entries"],
          g.topVenues.map(function (r) { return [r.venue, r.entries]; })));
        // Weapon popularity — which of the cosmetic melee weapons players
        // actually carry (WeaponIds from shared/assets/weapons/weapons.json).
        // Guarded only against an older backend (no weapons field at all);
        // a new backend with no reporting clients yet shows the board with
        // "no data yet", so you can tell "not deployed" from "no plays".
        if (g.weapons) {
          boards.appendChild(board("WEAPONS", ["weapon", "30d / all time"],
            g.weapons.map(function (r) {
              return [r.weapon, r.month + " / " + r.allTime];
            })));
        }
        section.appendChild(boards);
        main.appendChild(section);
      });

      // Sponsor impression report (guarded like totals: absent on an older
      // backend). One table, all games: the numbers ad invoices come from.
      if (data.sponsors && data.sponsors.length > 0) {
        var section = el("section", "game");
        section.appendChild(el("h2", null, "SPONSOR IMPRESSIONS"));
        var box = el("div", "board");
        var table = el("table");
        var tr = el("tr");
        tr.appendChild(el("th", null, "sponsor"));
        tr.appendChild(el("th", null, "game"));
        tr.appendChild(el("th", "num", "30 days"));
        tr.appendChild(el("th", "num", "all time"));
        table.appendChild(tr);
        data.sponsors.forEach(function (r) {
          var row = el("tr");
          row.appendChild(el("td", null, r.sponsorId));
          row.appendChild(el("td", null, r.gameId));
          row.appendChild(el("td", "num", Number(r.month).toLocaleString("en-US")));
          row.appendChild(el("td", "num", Number(r.allTime).toLocaleString("en-US")));
          table.appendChild(row);
        });
        box.appendChild(table);
        var boardsWrap = el("div", "boards");
        boardsWrap.appendChild(box);
        section.appendChild(boardsWrap);
        main.appendChild(section);
      }

      // Crash reports — the iPhone "it restarts itself" hunt. One row per
      // browser session that went down mid-play and came back on its own.
      // Guarded like the blocks above: absent on an older backend.
      if (data.crashes) {
        var crashSection = el("section", "game");
        var crashH2 = el("h2", null, "CRASH REPORTS");
        crashH2.appendChild(el("small", null,
          data.crashes.total + " on file · " + data.crashes.week + " in the last 7 days"));
        crashSection.appendChild(crashH2);

        var crashBox = el("div", "board");
        if (data.crashes.rows.length === 0) {
          crashBox.appendChild(el("p", "empty", "no crashes reported yet"));
        } else {
          var ct = el("table", "crash");
          var chead = el("tr");
          ["when", "game", "scene", "why", "device"].forEach(function (h) {
            chead.appendChild(el("th", null, h));
          });
          // Every number the recorder collects, on screen rather than in the
          // DB — this panel is a temporary investigation tool, so breadth beats
          // tidiness. Trim it back once the iPhone question is settled.
          // "hidden" sits up front deliberately: it counts times the page went
          // into the background, so 0 means the tab died while the player was
          // looking at it, and 1+ means iOS may simply have discarded a
          // backgrounded tab — a different bug with a different fix.
          ["alive", "hidden", "venues", "heap", "tex", "nodes", "objects",
           "resources", "orphans", "fps", "boots"].forEach(function (h) {
            chead.appendChild(el("th", "num", h));
          });
          ct.appendChild(chead);

          data.crashes.rows.forEach(function (c) {
            var row = el("tr");
            row.appendChild(el("td", null, crashWhen(c.at)));
            row.appendChild(el("td", null, c.gameId));
            row.appendChild(el("td", null, c.scene || "?"));
            // reason is only set when something actually fired (a JS error, a
            // lost GL context). Blank is the interesting case: the tab died
            // without a word, which is what a memory kill looks like.
            var why = el("td", null, c.reason || "silent");
            // The leftovers that do not earn a column of their own. memStatic
            // reads 0 on the web export (Godot does not report that monitor
            // there), so it is context, not a measurement.
            why.title = (c.events || "") +
              "\nnav: " + (c.navType || "?") +
              " · cores: " + c.cores +
              " · memStatic: " + mb(c.memStatic) +
              "\n" + (c.ua || "");
            row.appendChild(why);
            var device = el("td", null, c.screen + " @" + c.dpr + "x");
            device.title = c.ua || "";
            row.appendChild(device);
            row.appendChild(el("td", "num", Math.floor(c.uptime / 60) + "m" + (c.uptime % 60) + "s"));
            row.appendChild(el("td", "num", String(c.hidden)));
            row.appendChild(el("td", "num", String(c.venues)));
            row.appendChild(el("td", "num", mb(c.heap)));
            row.appendChild(el("td", "num", mb(c.texMem)));
            row.appendChild(el("td", "num", String(c.nodes)));
            row.appendChild(el("td", "num", String(c.objects)));
            row.appendChild(el("td", "num", String(c.resources)));
            row.appendChild(el("td", "num", String(c.orphans)));
            row.appendChild(el("td", "num", String(c.fps)));
            row.appendChild(el("td", "num", String(c.boots)));
            ct.appendChild(row);
          });
          crashBox.appendChild(ct);
        }

        var crashWrap = el("div", "boards");
        crashWrap.appendChild(crashBox);
        crashSection.appendChild(crashWrap);
        crashSection.appendChild(el("p", "totals-caption",
          "ALL NUMBERS ARE FROM THE LAST HEARTBEAT BEFORE THE TAB DIED. " +
          "READ \"HIDDEN\" FIRST: 0 MEANS THE TAB DIED WHILE THE PLAYER WAS " +
          "LOOKING AT IT (A REAL CRASH); 1+ MEANS IT HAD BEEN BACKGROUNDED, " +
          "AND iOS MAY SIMPLY HAVE DISCARDED IT. THEN \"WHY\": " +
          "\"WEBGLCONTEXTLOST\" IS A GPU PROBLEM, NOT A MEMORY ONE. " +
          "MEASURED ON DESKTOP 2026-07-25 OVER 4 VENUES / 285s: WASM HEAP " +
          "NEVER MOVED OFF 93M — THE GAME DOES NOT LEAK HEAP — WHILE TEX " +
          "CLIMBED 19M TO 33M WITH VENUE DEPTH AND DID NOT COME BACK. " +
          "SO TEX IS THE ONE NUMBER THAT RATCHETS. NODES / OBJECTS / " +
          "RESOURCES RISE DURING A RUN AND FALL AT GAME OVER: THAT IS " +
          "HEALTHY TEARDOWN. ORPHANS SHOULD ALWAYS BE 0. \"BOOTS\" COUNTS " +
          "RELOADS IN THAT TAB — 2 IS ONE DEATH, HIGHER MEANS IT DIED " +
          "REPEATEDLY IN ONE SITTING. HOVER \"WHY\" FOR THE EVENT LOG, NAV " +
          "TYPE AND USER AGENT."));
        main.appendChild(crashSection);
      }
    })
    .catch(function (e) {
      if (e.message === "403") return;
      var status = document.getElementById("status");
      if (status) status.textContent = "COULD NOT REACH THE STATS SERVER (" + e.message + ")";
    });
})();
</script>

</body>
</html>
